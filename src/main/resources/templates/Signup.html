<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://media.istockphoto.com/id/1279862993/photo/firewall-and-internet-security-concept-secured-access.jpg?s=612x612&w=0&k=20&c=ScokuWob0eqFTG40Dt3Pm7rfZZTUvglDwjmkwzUpqx8=');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 394px;
            margin: auto;
            padding: 51px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            margin-top: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="email"],
        input[type="password"],
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
        }
        button {
            background-color: rgb(0, 255, 0);
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Sign Up</h1>
    <form class="signup-form" id="signup-form">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>

        <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a th:href="@{/ui/login}">Login</a></p>
</div>

<script>
    // Inline script to ensure it always runs
    document.addEventListener('DOMContentLoaded', function() {
        const signupForm = document.getElementById('signup-form');

        if (signupForm) {
            signupForm.addEventListener('submit', async function(e) {
                e.preventDefault(); // Prevent default form submission
                console.log('Signup form submitted!');

                try {
                    const res = await fetch('/api/auth/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: document.getElementById('email').value,
                            password: document.getElementById('password').value
                        })
                    });

                    if (res.ok) {
                        const authResponse = await res.json();
                        const jwtToken = authResponse.token;

                        // Save the token to local storage
                        localStorage.setItem('jwt_token', jwtToken);

                        // Redirect to the notes page
                        window.location.href = '/ui/notes';
                    } else {
                        const error = await res.json().catch(() => ({ message: 'Signup failed' }));
                        alert('Signup failed: ' + (error.message || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Signup error:', error);
                    alert('An error occurred during signup. Please try again.');
                }
            });
        } else {
            console.error('Signup form not found!');
        }
    });
</script>
</body>
</html>
